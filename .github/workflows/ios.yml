name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填 tag（如 ios-v1.1.9）则同时把 IPA 发布到该 Release'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      # 百度地图/定位、环信等 pod 的 CDN 从 GitHub runner 访问不稳定，
      # 会出现 curl timeout / connection reset 导致 pod install 失败。
      # 缓存 CocoaPods 下载目录，让重试不必重新下载已经拿到的包。
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      # flutter build ios 内部会跑 pod install，所以直接对整个构建做重试，
      # 每次失败后清掉 Pods/Podfile.lock 再试，避免半成品缓存导致连续失败。
      - name: Build unsigned IPA (retry on flaky pod download)
        run: |
          set -o pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          echo "building version $VERSION build ${GITHUB_RUN_NUMBER}"

          for attempt in 1 2 3 4 5; do
            echo "===== build attempt $attempt ====="
            if flutter build ios --release --no-codesign \
                 --build-name="$VERSION" \
                 --build-number="${GITHUB_RUN_NUMBER}"; then
              echo "build succeeded on attempt $attempt"
              break
            fi
            echo "attempt $attempt failed; clearing Pods and build output, retrying"
            rm -rf ios/Pods ios/Podfile.lock build/ios
            sleep 20
          done

          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/ipa/Payload build/ios/ipa/course_helper-unsigned.ipa
          ls -lh build/ios/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: course_helper-ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # 可选：把 IPA 挂到 Release 上长期保存（artifact 只保留 14 天）。
      # 由 workflow_dispatch 的 release_tag 输入触发，不填则跳过。
      - name: Publish IPA to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          IPA="build/ios/ipa/course_helper-unsigned.ipa"
          test -f "$IPA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading asset"
          else
            gh release create "$TAG" \
              --title "course_helper iOS $TAG（未签名 IPA）" \
              --notes "未签名 iOS IPA，使用前需用自己的证书重签。

- Bundle ID：com.jxlnb.coursehelper
- 最低系统：iOS 13.0
- 安装方式：下载 ipa 后用自签工具签名安装

本产物不含任何 Apple 签名凭据。"
          fi

          gh release upload "$TAG" "$IPA" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
