name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build unsigned IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          flutter build ios --release --no-codesign \
            --build-name="$VERSION" \
            --build-number="${GITHUB_RUN_NUMBER}"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/ipa/Payload build/ios/ipa/course_helper-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: course_helper-ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
